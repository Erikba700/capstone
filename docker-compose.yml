services:
  app_capstone:
    build:
      context: .
      dockerfile: dev.Dockerfile
    ports:
      - '8000:8000'
    networks:
      - capstone_net
    environment:
      PGSQL_HOST: postgres_capstone
      PGSQL_PORT: 5432
      PGSQL_USER: postgres
      PGSQL_PASSWORD: postgres
      PGSQL_DB_NAME: postgres_capstone
      REDIS_HOST: redis_capstone
      REDIS_PORT: 6379
      REDIS_DB: 0
      EMAIL_ADDRESS: ${EMAIL_ADDRESS}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:-your-refresh-secret-key}
      BACKEND_URL: http://localhost:8000/api
    depends_on:
      postgres_capstone:
        condition: service_healthy
      redis_capstone:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: dev.Dockerfile
    command: /project/.venv/bin/celery -A app.celery_app worker --loglevel=info
    networks:
      - capstone_net
    environment:
      PGSQL_HOST: postgres_capstone
      PGSQL_PORT: 5432
      PGSQL_USER: postgres
      PGSQL_PASSWORD: postgres
      PGSQL_DB_NAME: postgres_capstone
      REDIS_HOST: redis_capstone
      REDIS_PORT: 6379
      REDIS_DB: 0
      EMAIL_ADDRESS: ${EMAIL_ADDRESS}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
    depends_on:
      postgres_capstone:
        condition: service_healthy
      redis_capstone:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: dev.Dockerfile
    command: /project/.venv/bin/celery -A app.celery_app beat --loglevel=info
    networks:
      - capstone_net
    environment:
      PGSQL_HOST: postgres_capstone
      PGSQL_PORT: 5432
      PGSQL_USER: postgres
      PGSQL_PASSWORD: postgres
      PGSQL_DB_NAME: postgres_capstone
      REDIS_HOST: redis_capstone
      REDIS_PORT: 6379
      REDIS_DB: 0
    depends_on:
      postgres_capstone:
        condition: service_healthy
      redis_capstone:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    networks:
      - capstone_net
    volumes:
      - ./frontend:/app:rw
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - app_capstone
    stdin_open: true
    tty: true

  postgres_capstone:
    image: 'postgres:17'
    ports:
      - '5432:5432'
    networks:
      - capstone_net
    volumes:
      - postgres_data_capstone:/var/lib/postgresql:rw
    environment:
      POSTGRES_DB: postgres_capstone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/17/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  redis_capstone:
    image: 'redis:7-alpine'
    ports:
      - '6379:6379'
    networks:
      - capstone_net
    volumes:
      - redis_data_capstone:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

networks:
  capstone_net:
    driver: bridge

volumes:
  postgres_data_capstone:
  redis_data_capstone:
